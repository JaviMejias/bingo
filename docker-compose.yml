services:
  bingo_backend:
    build: ./backend
    container_name: bingo_backend
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bingo_frontend:
    build: .
    container_name: bingo_frontend
    ports:
      - "8081:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - bingo_backend
